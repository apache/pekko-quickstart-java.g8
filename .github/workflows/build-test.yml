name: Build and test

on:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # we don't know what commit the last tag was it's safer to get entire repo so previousStableVersion resolves
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Install sbt
        uses: sbt/setup-sbt@ce95da69b39609ea153bad087708da5f37366897 # v1.5.10

      - name: Cache Coursier cache
        uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8.1.1

      - name: Render template and build docs
        # This renders the template with the default parameters into target/g8.
        run: sbt -Dfile.encoding=UTF8 -J-XX:ReservedCodeCacheSize=256M g8 docs/paradox

      - name: sbt test in templated app
        # Run directly rather than via g8Test: scripted skips the test because the
        # templated app uses sbt 2 while this build (paradox) is still on sbt 1.
        # testFull, because sbt 2's `test` is testQuick and may skip cached passes.
        working-directory: target/g8
        run: sbt -Dfile.encoding=UTF8 -J-XX:ReservedCodeCacheSize=256M testFull

      - name: mvn test in templated app
        working-directory: target/g8
        run: mvn -B test
